name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax Compilation Check
        run: |
          python -m py_compile app.py models.py seed_data.py Dummy_ERP/app.py

      - name: Run Flake8 Linter
        run: |
          flake8 . --count --show-source --statistics

  test:
    name: Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: Validate Database Seed Script
        run: |
          python seed_data.py

      - name: Upload Coverage Report Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312
          path: coverage.xml
          retention-days: 14

  smoke-test:
    name: Application Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Main App Context & Initialization
        run: |
          python -c "from app import app, db; ctx = app.app_context(); ctx.push(); db.create_all(); print('Main app initialized cleanly')"

      - name: Verify Dummy ERP App Context & Initialization
        run: |
          python -c "from Dummy_ERP.app import app, db; ctx = app.app_context(); ctx.push(); db.create_all(); print('Dummy ERP initialized cleanly')"

  ci-status:
    name: CI Completion Check
    needs: [lint, test, smoke-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
